version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: vibe_search_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vibe_search
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/prisma/init-vector-indexes.sql:/docker-entrypoint-initdb.d/init-vector-indexes.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vibe_search_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  embedding-service:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    container_name: vibe_search_embedding
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vibe_search
      REDIS_URL: redis://redis:6379
      PORT: 8000
      HOST: 0.0.0.0
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 360s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vibe_search_server
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vibe_search
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      REDIS_URL: redis://redis:6379
      PORT: 3000
      NODE_ENV: development
      INSTAGRAM_USERNAME: ${INSTAGRAM_USERNAME:-}
      INSTAGRAM_PASSWORD: ${INSTAGRAM_PASSWORD:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
    command: sh -c "npm run dev"
    restart: unless-stopped

  init:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vibe_search_init
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vibe_search
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      REDIS_URL: redis://redis:6379
      INSTAGRAM_USERNAME: ${INSTAGRAM_USERNAME:-}
      INSTAGRAM_PASSWORD: ${INSTAGRAM_PASSWORD:-}
      PGPASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apt-get update && apt-get install -y postgresql-client curl wget || true
        echo "Regenerating Prisma client for Debian..."
        npm run db:generate
        echo "Installing Playwright browsers..."
        npx playwright install chromium --with-deps || npx playwright install chromium
        echo "Waiting for services to be ready..."
        sleep 20
        echo "Setting up database..."
        npm run db:push
        echo "Initializing vector indexes..."
        psql -h postgres -U postgres -d vibe_search -f prisma/init-vector-indexes.sql 2>&1 || echo "Indexes may already exist"
        echo "Seeding products..."
        npm run seed:products
        echo "Waiting for embedding service models to load..."
        timeout=180
        elapsed=0
        while [ $elapsed -lt $timeout ]; do
          if wget --quiet --spider http://embedding-service:8000/health/ready 2>/dev/null || curl -f http://embedding-service:8000/health/ready >/dev/null 2>&1; then
            echo "Embedding service ready"
            break
          fi
          echo "Waiting... ($elapsed/$timeout seconds)"
          sleep 5
          elapsed=$((elapsed + 5))
        done
        echo "Processing product embeddings..."
        npm run process:products || echo "Product embedding processing completed with warnings"
        echo "Scraping Pinterest..."
        npm run scrape:pinterest || echo "Pinterest scraping completed with warnings"
        echo "Scraping Instagram..."
        npm run scrape:instagram || echo "Instagram scraping completed with warnings"
        echo "Processing scraped image embeddings..."
        npm run process:images || echo "No scraped images to process"
        echo "Initialization complete!"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vibe_search_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      server:
        condition: service_started
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm run dev"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
